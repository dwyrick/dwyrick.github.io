<title>Privacy Policy</title>
<h1>Privacy Policy</h1>
<p>This app is a private rclone setup used only by its owner. It accesses one Google account to upload and manage files in that account's Google Drive.</p>
<p>It sends data only to that Google Drive. Sign-in tokens stay on the owner's computer.</p>
